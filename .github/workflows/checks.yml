name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --ignore-scripts --config.strictDepBuilds=false
      - uses: actions/checkout@v4
        with:
          repository: averyjohnkucan-arch/dsh-model-scheduler
          ref: ed1c46a8a594e3ec15f529161ce92e9dd849c2b1
          path: .ci/scheduler
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: echo "DSH_MODEL_SCHEDULER_ROOT=$GITHUB_WORKSPACE/.ci/scheduler" >> "$GITHUB_ENV"
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm pack --out /tmp/plugin-ci.tgz
